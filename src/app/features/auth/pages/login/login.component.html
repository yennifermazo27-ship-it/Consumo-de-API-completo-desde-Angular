<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Iniciar sesión</h2>

    <label>
      Correo
      <input type="email" formControlName="email" placeholder="cliente@helpdesk.dev" />
    </label>
    <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
      Ingresa un correo válido.
    </small>

    <label>
      Contraseña
      <input type="password" formControlName="password" />
    </label>
    <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
      La contraseña es obligatoria.
    </small>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="btn-primary" [disabled]="loading">
      {{ loading ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="switch">¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a></p>
  </form>
</div>
